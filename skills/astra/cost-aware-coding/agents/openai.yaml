interface:
  display_name: "Cost-aware coding"
  short_description: "Delegate substantial coding when handoff cost is justified"
  default_prompt: "Use $cost-aware-coding for this coding task. Delegate to one suitable implementation worker only when the implementation and verification are likely to repay assignment, custody, and review overhead; keep consequential decisions and final review with the lead."
policy:
  allow_implicit_invocation: false
