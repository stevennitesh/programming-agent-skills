policy:
  allow_implicit_invocation: true

interface:
  display_name: "High-Assurance Review"
  short_description: "Coordinator-owned high-risk release review"
  default_prompt: "Use $high-assurance-review as the assurance-coordinator to review one immutable release candidate or supported high-risk diff or PR through exactly two fresh core reviewer lanes and return one verified read-only release decision."
