interface:
  display_name: "Audit Codebase"
  short_description: "Map, audit one subsystem, or analyze one candidate"
  default_prompt: "Use $audit-codebase for exactly one explicit objective: Map the repository, Audit one supplied subsystem ID from a supplied report, or Analyze one supplied candidate ID from a supplied report. Never fall back from an invalid report-backed selection to Map. Rebuild current evidence, apply the required coverage, publish only the affected durable HTML regions once, and stop without selecting or starting downstream work."

policy:
  allow_implicit_invocation: false
