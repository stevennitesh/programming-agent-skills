policy:
  allow_implicit_invocation: true

interface:
  display_name: "Convergent PR Review"
  short_description: "Root-owned high-risk release review"
  default_prompt: "Use $convergent-pr-review from the top-level root to pin one immutable local PR or bounded high-risk diff, cover every required lens through fresh reviewers or the exact degraded fallback, and return one verified read-only release decision."
