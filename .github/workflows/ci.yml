name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-linux:
    name: Verify (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate public repository
        run: python -m scripts.validate_skills --public

      - name: Run test suite
        run: python -m pytest -n 0

  verify-windows:
    name: Verify (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Exercise Windows runtime mechanisms
        run: >-
          python -m pytest -n 0
          tests/test_install_skills.py::test_install_lock_excludes_a_recovery_process
          tests/test_install_skills.py::test_recovery_handles_interruption_between_update_renames
          tests/test_lane_execution.py::test_readiness_uses_shared_inputs_local_outputs_and_real_imports
          tests/test_lane_execution.py::test_environment_names_follow_host_case_rules
          tests/test_lane_execution.py::test_exec_preserves_case_distinct_environment_on_supported_hosts
          tests/test_lane_execution.py::test_timeout_stops_launched_process_tree
          tests/test_astra_atlas_proof_inputs.py::test_large_source_selection_rejects_an_absolute_sibling_path
          tests/test_astra_atlas_workflow.py::test_relative_path_verifier_runs_from_repository_and_binds_actual_binary
          tests/test_astra_atlas_cli_inputs.py::test_bulk_proof_paths_use_file_transport_for_verification_and_preparation
          tests/test_validate_skills.py::test_pytest_runtime_isolates_and_removes_disposable_state
